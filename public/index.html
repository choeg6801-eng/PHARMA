  root.innerHTML=head('추적 · 품질','유통기한 임박 재고',CUR.desc)+`<div class="kpis" id="ek"></div>
  <section class="card"><div class="card-h"><div class="chips" id="ef">${['전체','만료','90일 이내','180일 이내'].map(t=>`<button class="chip" aria-pressed="${t===f}">${t}</button>`).join('')}</div>${addBtn('inventory')}</div><div id="et"></div></section>`;
  const rows=INV.map(i=>{const p=P(i.p),life=Math.max(1,i.exp-i.mfg),pct=clamp(i.exp/life,0,1),val=(i.qty||0)*(p.price||0);return{...i,pp:p,pct,val}});
  const b=r=>r.exp<0?'만료':r.exp<=90?'90':r.exp<=180?'180':'ok';
  const sum=k=>rows.filter(r=>b(r)===k).reduce((a,r)=>a+r.val,0);
  $('#ek').innerHTML=`<div class="kpi"><span class="l">만료 재고 가치</span><span class="v down">${usd(sum('만료'))}</span><span class="d">즉시 폐기·손상 처리</span></div><div class="kpi"><span class="l">90일 이내 만료</span><span class="v" style="color:var(--warn)">${usd(sum('90'))}</span><span class="d">${rows.filter(r=>b(r)==='90').length}개 로트</span></div><div class="kpi"><span class="l">91–180일</span><span class="v">${usd(sum('180'))}</span><span class="d">판촉 대상</span></div><div class="kpi"><span class="l">정상 재고</span><span class="v">${usd(sum('ok'))}</span><span class="d">공급가 기준</span></div>`;
  const act=r=>r.exp<0?pill('crit','폐기·손상 처리'):r.exp<=90?pill('warn',r.c==='KR'?'단기 수요처 우선 출하':'인근 대리점 재배치'):r.exp<=180?pill('info','프로모션 출하'):pill('ok','정상');
  const draw=()=>{if(!INV.length){$('#et').innerHTML=emptyState('expiry','등록된 재고 로트가 없습니다','로트 번호, 위치, 수량, 유효기한을 입력하면 FEFO 순서로 정리합니다.','inventory');return}
   const m={'전체':()=>true,'만료':r=>r.exp<0,'90일 이내':r=>r.exp>=0&&r.exp<=90,'180일 이내':r=>r.exp>=0&&r.exp<=180}[f];
   $('#et').innerHTML=`<div class="tbl"><table class="data"><thead><tr><th>로트</th><th>품목</th><th>위치</th><th class="r">수량</th><th>유효기한</th><th style="min-width:170px">남은 유효기간</th><th class="r">재고 가치</th><th>권장 조치</th><th></th></tr></thead><tbody>${rows.filter(m).sort((a,b)=>a.exp-b.exp).map(r=>`<tr class="click" data-rid="${r._id}"><td class="mono">${esc(r.lot)}</td><td>${esc(r.pp.short)}</td><td>${esc(r.loc)} <span class="code">${r.c}</span></td><td class="r">${nf(r.qty||0)}</td><td class="mono">${fd(pd(r.expDate))}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="meter" style="flex:1"><span style="width:${r.pct*100}%;background:var(--${r.exp<0?'crit':r.exp<=90?'warn':r.exp<=180?'accent':'ok'});border-radius:999px"></span></div><span class="mono note" style="width:52px;text-align:right">${ddl(r.exp)}</span></div></td><td class="r">${usd(r.val)}</td><td>${act(r)}</td><td class="r">${editBtn('inventory',r._id)}</td></tr>`).join('')||`<tr><td colspan="9" class="note">조건에 맞는 재고가 없습니다.</td></tr>`}</tbody></table></div>`};
  $('#ef').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;f=c.textContent;$$('#ef .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));draw()};
  root.onclick=e=>{const tr=e.target.closest('tr[data-rid]');if(tr&&!e.target.closest('[data-edit]')){const r=INV.find(x=>x._id===tr.dataset.rid);if(r)openEditor('inventory',r)}};
  draw();

/* 18. tender */
def('tender','영업 · 채널','글로벌 입찰 & 낙찰가 분석','참여할 해외 입찰을 기록하고, 과거 낙찰가를 바탕으로 기대이익이 가장 큰 입찰가를 찾습니다.',root=>{
  if(!TENDERS.length){root.innerHTML=head('영업 · 채널','글로벌 입찰 & 낙찰가 분석',CUR.desc)+`<section class="card">${emptyState('tender','등록된 입찰이 없습니다','공고번호, 마감일, 예정 단가, 과거 낙찰가를 입력하면 최적 입찰가를 계산합니다.','tenders','첫 입찰 추가')}</section>`;return}
  let sel=TENDERS[0]._id;
  root.innerHTML=head('영업 · 채널','글로벌 입찰 & 낙찰가 분석',CUR.desc)+`
  <section class="card"><div class="card-h"><div><h2 class="ct">입찰 공고</h2><div class="sub">행을 누르면 시뮬레이터가 바뀝니다</div></div>${addBtn('tenders')}</div><div class="tbl"><table class="data"><thead><tr><th>공고번호</th><th>발주처</th><th>품목</th><th class="r">수량</th><th class="r">예정 단가</th><th>마감</th><th></th></tr></thead><tbody id="tt"></tbody></table></div></section>
  <div class="row"><section class="card c-5 stack" id="tin"></section><section class="card c-7 stack"><div class="card-h" style="margin:0"><h2 class="ct">입찰가별 기대이익</h2>${legend([['기대이익','--accent'],['낙찰 확률 (비율)','--c4']])}</div><div class="chart-box" id="tch"></div><div id="tout"></div></section></div>`;
  function model(t){const p=P(t.p),cost=(p.cost||0)/FX.USD.s[FX.USD.s.length-1]*1.12,past=t.past.length?t.past:[t.bud];const mu=past.reduce((a,b)=>a+b,0)/past.length,sd=Math.sqrt(past.reduce((a,b)=>a+(b-mu)**2,0)/past.length)||mu*.04;
    const prob=x=>1/(1+Math.exp((x-mu)/(sd*.7)));return{p,cost,mu,sd,past,prob,ev:x=>prob(x)*(x-cost)*(t.qty||0)}}
  function draw(keep){
    $('#tt').innerHTML=[...TENDERS].sort((a,b)=>a.d-b.d).map(t=>`<tr class="click ${t._id===sel?'sel':''}" data-id="${t._id}"><td class="mono">${esc(t.id)}</td><td>${esc(t.org)} <span class="code">${t.c}</span></td><td>${esc(t.item||P(t.p).short)}</td><td class="r">${nf(t.qty||0)}</td><td class="r">${usd(t.bud)}</td><td>${pill(t.d<0?'plain':t.d<=10?'crit':t.d<=21?'warn':'ok',t.d<0?'마감됨':ddl(t.d))}</td><td class="r">${editBtn('tenders',t._id)}</td></tr>`).join('');
    const t=TENDERS.find(x=>x._id===sel)||TENDERS[0],m=model(t);
    const lo=Math.max(0.01,Math.floor(Math.min(...m.past,t.bud)*.85)),hi=Math.ceil(Math.max(t.bud,...m.past)*1.02),stp=Math.max(+((hi-lo)/60).toFixed(2),.01);const xs=[];for(let i=0;lo+i*stp<=hi+1e-9;i++)xs.push(+(lo+i*stp).toFixed(2));
    let best=xs[0];xs.forEach(x=>{if(x<=t.bud&&m.ev(x)>m.ev(best))best=x});
    if(!keep)$('#tin').innerHTML=`<div><div class="eyebrow">${COUNTRY[t.c]||t.c} · ${esc(t.id)}</div><h2 class="ct" style="font-size:19px;margin-top:4px">${esc(t.item||P(t.p).short)} ${nf(t.qty||0)}개</h2></div>
     <dl class="kv"><dt>과거 낙찰가 평균</dt><dd>${usd(m.mu,2)} (${m.past.length}건)</dd><dt>과거 낙찰가 범위</dt><dd>${usd(Math.min(...m.past))} – ${usd(Math.max(...m.past))}</dd><dt>당사 원가 (물류 포함)</dt><dd>${usd(m.cost,2)}</dd><dt>예정 단가 (상한)</dt><dd>${usd(t.bud)}</dd></dl>
     <div class="field"><label for="tb">당사 입찰 단가 <b id="tbv" class="num" style="color:var(--ink)"></b></label><input id="tb" type="range" min="${lo}" max="${hi}" step="${+stp.toFixed(2)}" value="${best}"></div>
     <button class="btn" id="tbest">최적 입찰가로 설정</button>`;
    const cur=+$('#tb').value;$('#tbv').textContent=usd(cur,2);
    charts=charts.filter(z=>z.el.id!=='tch');
    const evs=xs.map(x=>m.ev(x)/1000),mxe=Math.max(...evs,0.001);
    mount($('#tch'),el=>lineChart(el,{labels:xs.map(x=>'$'+nf(x,x<10?1:0)),series:[{name:'기대이익',values:evs.map(v=>+v.toFixed(2)),c:'--accent',area:true},{name:'낙찰확률',values:xs.map(x=>+(m.prob(x)*mxe).toFixed(2)),c:'--c4',dash:true,w:1.6,noTip:true}],points:[{i:xs.indexOf(best),v:+(m.ev(best)/1000).toFixed(2),c:'--ok'}],yFmt:v=>(v<0?'-$':'$')+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(1).replace(/\.0$/,'')+'M':Math.abs(v)+'k'),tipFmt:v=>'$'+nf(v,1)+'k',tipLabel:i=>`입찰가 ${usd(xs[i],2)} · 낙찰확률 ${Math.round(m.prob(xs[i])*100)}%`,h:240}));
    const pc=m.prob(cur),mg=cur?(cur-m.cost)/cur:0;
    $('#tout').innerHTML=`<div class="kpis"><div class="kpi"><span class="l">낙찰 확률</span><span class="v">${Math.round(pc*100)}%</span></div><div class="kpi"><span class="l">낙찰 시 이익</span><span class="v">${usd((cur-m.cost)*(t.qty||0))}</span><span class="d">마진 ${(mg*100).toFixed(1)}%</span></div><div class="kpi"><span class="l">기대이익</span><span class="v">${usd(m.ev(cur))}</span></div></div>
    <div class="callout ${Math.abs(cur-best)/best<.01?'ok':''}"><b>최적 입찰가 ${usd(best,2)}</b>낙찰 확률 ${Math.round(m.prob(best)*100)}%, 기대이익 ${usd(m.ev(best))}. ${m.past.length<3?'과거 낙찰가가 3건 미만이라 추정 오차가 큽니다. 공고 수정에서 더 입력하세요.':mg<.08?'마진이 8% 미만이면 A/S·교육 비용 반영 여부를 확인하세요.':'과거 낙찰가 분포를 로지스틱 곡선으로 근사한 값입니다.'}</div>`;
    $('#tb').oninput=()=>draw(true);$('#tbest').onclick=()=>{$('#tb').value=best;draw(true)};
  }
  $('#tt').onclick=e=>{const tr=e.target.closest('tr[data-id]');if(tr&&!e.target.closest('[data-edit]')){sel=tr.dataset.id;draw()}};draw();
},()=>TENDERS.filter(t=>t.d>=0&&t.d<=10).length);

def('distributor','영업 · 채널','해외 대리점 재고·성과','대리점별 재고와 판매량을 기록하면 재고일수, 회전율, 재주문 시점과 권장 발주량을 계산합니다.',root=>{
  if(!DIST.length){root.innerHTML=head('영업 · 채널','해외 대리점 재고·성과',CUR.desc)+`<section class="card">${emptyState('distributor','등록된 대리점이 없습니다','현재고와 월평균 판매량, 리드타임을 입력하면 재주문 시점을 알려줍니다.','distributors','첫 대리점 추가')}</section>`;return}
  let sel=DIST[0]._id;const rows=()=>DIST.map(d=>({d,k:distCalc(d)}));
  root.innerHTML=head('영업 · 채널','해외 대리점 재고·성과',CUR.desc)+`
  <section class="card"><div class="card-h"><div><h2 class="ct">대리점 재고 현황</h2><div class="sub">안전재고 14일분 · 리드타임 반영 · 재고 숫자를 바로 고칠 수 있습니다</div></div>${addBtn('distributors')}</div><div class="tbl"><table class="data"><thead><tr><th>대리점</th><th class="r">현재고</th><th class="r">월평균 판매</th><th class="r">재고일수</th><th class="r">연 회전율</th><th class="r">재주문점</th><th class="r">권장 발주량</th><th>상태</th><th></th></tr></thead><tbody id="dt"></tbody></table></div></section>
  <div class="row"><section class="card c-7"><div class="card-h"><h2 class="ct" id="dT"></h2>${legend([['월 판매량','--accent']])}</div><div class="chart-box" id="dch"></div></section>
  <section class="card c-5"><div class="card-h"><div><h2 class="ct">대리점 성과 랭킹</h2><div class="sub">연 매출 · 입찰 성공률</div></div></div><div id="drank"></div></section></div>`;
  function draw(){const R=rows();
    $('#dt').innerHTML=R.map(({d,k})=>`<tr class="click ${d._id===sel?'sel':''}" data-id="${d._id}"><td><div style="font-weight:600">${esc(d.n)} <span class="code">${d.c}</span></div>${d.memo?`<div class="note">${esc(d.memo.slice(0,40))}</div>`:''}</td><td class="r"><input class="cell-in" type="number" data-stock="${d._id}" value="${d.stock}" aria-label="현재고"></td><td class="r">${nf(d.avg)}</td><td class="r" style="color:var(--${k.dos<d.lead?'crit':k.dos>180?'accent':'ink'});font-weight:700">${k.dos==null?'—':k.dos+'일'}</td><td class="r">${k.turn.toFixed(1)}회</td><td class="r">${nf(k.rop)}</td><td class="r">${k.order?'<b>'+nf(k.order)+'</b>':'—'}</td><td>${pill(k.st[0],k.st[1])}</td><td class="r">${editBtn('distributors',d._id)}</td></tr>`).join('');
    const x=R.find(r=>r.d._id===sel)||R[0],d=x.d;$('#dT').textContent=`${d.n} · 최근 12개월 판매`;
    charts=charts.filter(z=>z.el.id!=='dch');
    mount($('#dch'),el=>lineChart(el,{labels:MONTHS,series:[{name:'판매',values:d.sell,c:'--accent',area:true}],marks:[{v:x.k.rop,t:'재주문점 '+nf(x.k.rop),c:'--warn'},{v:d.stock,t:'현재고 '+nf(d.stock),c:'--c3'}],yMin:0,h:250}));
    $('#drank').innerHTML=hbars([...DIST].sort((a,b)=>(b.rev||0)-(a.rev||0)).map(d=>({label:`${esc(d.n)} <span class="code">${d.c}</span>`,value:d.rev||0.0001,text:`$${(d.rev||0).toFixed(1)}M · ${Math.round((d.win||0)*100)}%`,c:(d.win||0)>=.55?'--ok':(d.win||0)>=.4?'--accent':'--c7'})))}
  const toNum=v=>+v||0;
  $('#dt').onclick=e=>{if(e.target.closest('input,[data-edit]'))return;const tr=e.target.closest('tr[data-id]');if(tr){sel=tr.dataset.id;draw()}};
  $('#dt').addEventListener('change',e=>{const i=e.target.closest('[data-stock]');if(i){const d=DIST.find(x=>x._id===i.dataset.stock);d.stock=Math.max(0,toNum(i.value));persist('distributors');toast(`${d.n} 재고를 ${nf(d.stock)}개로 저장했습니다.`);draw();buildNav()}});
  draw();
},()=>DIST.filter(d=>['crit','warn'].includes(distCalc(d).st[0])).length);

def('invoice','무역 서류','인보이스·패킹리스트 생성','거래 정보와 품목을 입력하면 상업송장과 포장명세서가 작성됩니다. 작성한 서류는 보관함에 저장해 다시 불러올 수 있습니다.',root=>{
  const exporter=[PROFILE.company,PROFILE.address].filter(Boolean).join('\n')||'회사명\n주소';
  let items=[{d:'Atorvastatin Calcium Tablets 20mg (30 tablets/bottle) ARP-AT20',hs:'3004.90',q:20000,u:2.6,nw:.09,gw:.13,lot:'AT2606K',ex:fd(addDays(TODAY,985)).slice(0,7)},{d:'Metformin HCl Tablets 500mg (100 tablets/bottle) ARP-MF500',hs:'3004.90',q:15000,u:1.9,nw:.14,gw:.19,lot:'MF2606B',ex:fd(addDays(TODAY,900)).slice(0,7)}];
  let mode='CI';
  const FL=[['xp','수출자 (Shipper)',exporter],['cn','수입자 (Consignee)','Rhein Pharma Vertrieb GmbH\nHafenstrasse 12, 20457 Hamburg, Germany'],['no','인보이스 번호','CI-26-0827'],['dt','일자',fd(TODAY)],['inc','인코텀즈','FOB Busan'],['pay','결제조건','T/T 45 days after B/L date'],['pol','선적항','Busan, Korea'],['pod','도착항','Hamburg, Germany'],['vs','선박 / 항차','COLDWAY HARMONY V.2609E']];
  root.innerHTML=head('무역 서류','인보이스·패킹리스트 생성',CUR.desc)+`
  <div class="row"><section class="card c-5 stack"><div class="card-h" style="margin:0"><h2 class="ct">거래 정보</h2><button class="btn sm" id="iload">${ic('upload')}품목 불러오기</button></div><div class="form">${FL.map(f=>`<div class="field" style="${f[2].includes('\n')?'grid-column:1/-1':''}"><label for="iv-${f[0]}">${f[1]}</label>${f[2].includes('\n')?`<textarea id="iv-${f[0]}" rows="${Math.max(2,f[2].split('\n').length)+1}">${esc(f[2])}</textarea>`:`<input id="iv-${f[0]}" value="${esc(f[2])}">`}</div>`).join('')}</div>
   <div class="divider"></div><div class="card-h" style="margin:0"><h2 class="ct">품목</h2><button class="btn sm" id="iadd">${ic('plus')}품목 추가</button></div><div id="iitems" class="stack"></div><div id="ipick" hidden class="pick"></div></section>
  <section class="card c-7 stack"><div class="card-h" style="margin:0"><div class="chips" id="imode"><button class="chip" data-m="CI" aria-pressed="true">Commercial Invoice</button><button class="chip" data-m="PL" aria-pressed="false">Packing List</button></div><div class="hstack"><button class="btn" id="icopy">텍스트 복사</button><button class="btn pri" id="isave">${ic('download')}보관함에 저장</button></div></div><div id="idoc"></div><textarea id="ifb" class="mono" hidden rows="6" style="width:100%"></textarea></section></div>
  <section class="card"><div class="card-h"><div><h2 class="ct">서류 보관함</h2><div class="sub">저장한 인보이스를 다시 열어 수정할 수 있습니다</div></div></div><div id="iarch"></div></section>`;
  const v=k=>$('#iv-'+k).value;
  function drawItems(){$('#iitems').innerHTML=items.map((it,i)=>`<div class="item-row"><div class="field"><label>품명</label><input data-i="${i}" data-k="d" value="${esc(it.d)}"></div><div class="field"><label>HS</label><input data-i="${i}" data-k="hs" value="${esc(it.hs)}"></div><div class="field"><label>수량</label><input data-i="${i}" data-k="q" type="number" value="${it.q}"></div><div class="field"><label>단가 USD</label><input data-i="${i}" data-k="u" type="number" value="${it.u}"></div><button class="icon-btn" data-del="${i}" aria-label="품목 삭제">${ic('x')}</button><div class="lot-pair"><div class="field"><label>로트 번호 (패킹리스트)</label><input data-i="${i}" data-k="lot" value="${esc(it.lot||'')}" placeholder="예: DX2607A"></div><div class="field"><label>유통기한 (패킹리스트)</label><input data-i="${i}" data-k="ex" value="${esc(it.ex||'')}" placeholder="예: 2027-07 또는 N/A"></div></div></div>`).join('')}
  function doc(){
    const tot=items.reduce((a,b)=>a+b.q*b.u,0),tq=items.reduce((a,b)=>a+b.q,0),nw=items.reduce((a,b)=>a+b.q*(b.nw||1),0),gw=items.reduce((a,b)=>a+b.q*(b.gw||1.5),0);

function applyCol(n,v){
  if(v===undefined)return;
  if(ARRS[n]){if(!Array.isArray(v))return;const a=ARRS[n];a.splice(0,a.length,...JSON.parse(JSON.stringify(v)));a.forEach(r=>{r._id=r._id||uidGen()});if(DATA_FIX[n]){let ch=false;a.forEach(r=>{try{if(DATA_FIX[n](r))ch=true}catch(e){}});if(ch)setTimeout(()=>{try{WS.save(n)}catch(e){}},0)}}
  else if(n==='profile')Object.assign(PROFILE,v||{});
  else if(n==='checklist')CHECKLIST=v||{};
  else if(n==='approvals'){for(const k of Object.keys(APPR))delete APPR[k];Object.assign(APPR,migrateAppr(v||{}))}
  else if(n==='apprMemo')APPR_MEMO=v||{};
  else if(n==='ctd')CTD=(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  else if(n==='carriers')CARR=(v&&Array.isArray(v.routes))?{routes:v.routes.filter(l=>l&&typeof l.r==='string'&&Array.isArray(l.v)).map(l=>({r:l.r,m:l.m==='해상'?'해상':'항공',v:CARR_CARS.map((_,i)=>{const x=l.v[i];return x==null||x===''||isNaN(+x)?null:+x})}))}:{routes:[]};
  hydrate(n);
}
function hydrate(n){
  const D=WSC[n];
  if(D&&D.dates)D.arr().forEach(r=>{for(const [df,off] of Object.entries(D.dates))r[off]=dleft(pd(r[df]))});
  if(n==='distributors')DIST.forEach(r=>{if(!Array.isArray(r.sell)||r.sell.length!==12)r.sell=genSell(r.avg||0,(r.n||'').length)});
  if(n==='tenders')TENDERS.forEach(r=>{r.past=(r.past||[]).map(Number).filter(x=>!isNaN(x))});
  if(n==='monthly')MONTHLY.sort((a,b)=>a.month<b.month?-1:1);
  if(n==='coldlogs')rebuildCold();
}
function serialize(n){
  if(ARRS[n]){const D=WSC[n],drop=D&&D.dates?Object.values(D.dates):[];return ARRS[n].map(r=>{const o={...r};drop.forEach(k=>delete o[k]);return o})}
  return n==='profile'?{...PROFILE}:n==='checklist'?CHECKLIST:n==='approvals'?APPR:n==='apprMemo'?APPR_MEMO:n==='carriers'?CARR:n==='ctd'?CTD:null;
}

/* 저장소: 로그인한 claude.ai 사용자는 계정별 비공개 클라우드, 그 외에는 이 브라우저 */
const WS={mode:'local',db:null,uid:null,q:{},pending:0,
  lkey:n=>'aph-ws2-'+n,
  local(n){return store.get(this.lkey(n),undefined)},
  ref(n){return this.db.doc(`data/users/${this.uid}/${n}`)},
  async connect(){try{const c=window.claude;if(!c||typeof c.use!=='function')return false;const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return false;const id=await user.id();if(!id)return false;this.db=db;this.uid=id;this.mode='cloud';return true}catch(e){return false}},
  async pull(n){const s=await this.ref(n).get();return s.exists?(s.data()||{}).v:undefined},
  save(n){const v=serialize(n);store.set(this.lkey(n),v);
    if(this.mode!=='cloud'){saveStatus();return Promise.resolve()}
    this.pending++;saveStatus();
    const run=async()=>{const body={v,at:new Date().toISOString()};
      try{await this.ref(n).set(body)}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await this.ref(n).set(body);return}catch(_){}}
        if(e&&e.code==='quota_exceeded')toast('저장 공간이 가득 찼습니다. 오래된 기록을 지워 주세요.');
        else{this.mode='local';toast('클라우드에 저장하지 못해 이 브라우저에만 저장했습니다.')}}
      finally{this.pending--;saveStatus()}};
    this.q[n]=(this.q[n]||Promise.resolve()).then(run);return this.q[n]}
};
function saveStatus(){const el=$('#saveStatus');if(!el)return;const c=WS.mode==='cloud';el.classList.toggle('live',c);el.querySelector('span').textContent=WS.pending?'저장 중…':c?'내 계정에 저장됨':'이 브라우저에 저장'}
function persist(n){hydrate(n);return WS.save(n)}

function openEditor(col,row,opts={}){

function submitEditor(e){e&&e.preventDefault();if(!EDIT)return;const D=WSC[EDIT.col],vals={};
  for(const f of D.fields){vals[f.k]=readField(f);const empty=vals[f.k]===''||vals[f.k]==null;if(f.o.req&&empty){toast(`${f.l} 항목을 입력하세요.`);$('#ef-'+f.k).focus();return}}

/* 콜드체인 업로드 기록을 COLD 목록에 합치기 */
const COLD_SAMPLE=COLD.slice();
function runs(t){const ev=[];let run=null;t.forEach((v,i)=>{const bad=v<2||v>8;if(bad&&!run)run={s:i,peak:v};if(bad&&run)run.peak=v>8?Math.max(run.peak,v):Math.min(run.peak,v);if(!bad&&run){run.e=i-1;ev.push(run);run=null}});if(run){run.e=t.length-1;ev.push(run)}return ev}
function rebuildCold(){COLD.splice(0,COLD.length,...COLDLOGS.map(l=>({id:l.name,sh:'업로드',route:l.route||'직접 업로드한 로거 기록',data:l,ex:runs(l.t),_id:l._id})),...(PROFILE.hideColdSamples?[]:COLD_SAMPLE))}
function parseLoggerCSV(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),ts=[],t=[],h=[];let hasH=false;
  for(const line of lines){const c=line.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''));if(c.length<2)continue;const tv=parseFloat(c[1]);if(isNaN(tv))continue;
    const d=new Date(c[0].replace(' ','T'));ts.push(isNaN(d)?c[0]:`${fmd(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);t.push(+tv.toFixed(2));const hv=parseFloat(c[2]);h.push(isNaN(hv)?null:+hv.toFixed(1));if(!isNaN(hv))hasH=true}
  if(t.length<3)return null;
  let step=Math.ceil(t.length/2000),pick=(a)=>a.filter((_,i)=>i%step===0);
  return {ts:pick(ts),t:pick(t),h:hasH?pick(h).map(v=>v??0):null};
}

function startVitals(){
  const box=$('#vmon');if(!box)return;const ch=vitalChannels();const cvs=$$('canvas',box);const t0=performance.now();

  const tick=()=>{const tm=$('#vmTime');if(tm)tm.textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false})};tick();
  function draw(now){if(!box.isConnected){cancelAnimationFrame(vmRAF);vmRAF=null;return}
    cvs.forEach(cv=>{const c=ch[+cv.dataset.ch],dpr=devicePixelRatio||1,W=cv.clientWidth,H=64;if(!W)return;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
      const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
      g.fillStyle='rgba(120,200,190,.10)';for(let x=8;x<W;x+=16)for(let y=8;y<H;y+=16)g.fillRect(x,y,1,1);
      const d=c.data,n=d.length,lo=Math.min(...d),hi=Math.max(...d),pad=8,sc=(hi-lo)||1;
      const pts=c.kind==='ecg'?d.map((v,i)=>[i/(n-1)*W,H*.62-v*H*.48]):d.map((v,i)=>[i/(n-1)*W,H-pad-(v-lo)/sc*(H-pad*2)]);

const EXPO_F={'파트너링':'바이오의약품','종합':'','원료·CDMO':'원료의약품','완제·제네릭':'전문의약품','바이오':'바이오의약품','포장·제조':''};
/* 일정 갱신: 배포 사이트의 public/expos.json 에 바뀐 날짜만 적으면 코드를 고치지 않고 반영됩니다. (미리보기에서는 파일이 없어 건너뜁니다) */
let EXPO_ASOF='2026-10-08',EXPO_LOADED=false;
const okD=a=>Array.isArray(a)&&a.length===2&&a.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d)))&&a[0]<=a[1];
async function loadExpoUpdates(){
  if(EXPO_LOADED)return false;EXPO_LOADED=true;
  try{
    const r=await fetch('expos.json',{cache:'no-cache',headers:{Accept:'application/json'}});if(!r.ok)return false;
    const j=await r.json();let n=0;
    (j.updates||[]).forEach(u=>{
      const x=EXPOS.find(e=>e.n===u.n);if(!x){console.warn('expos.json: 이름이 맞는 박람회가 없습니다 →',u.n);return}
      if(('next' in u&&u.next!==null&&!okD(u.next))||('last' in u&&u.last!==null&&!okD(u.last))){console.warn('expos.json: 날짜 형식이 올바르지 않습니다 →',u.n);return}
      ['last','next','city','venue','url','q','m','cyc','tip'].forEach(k=>{if(k in u)x[k]=u[k]});
      if(x.next){delete x.unk;x.q=u.q||'o'}n++});
    if(/^\d{4}-\d{2}-\d{2}$/.test(j.asof||''))EXPO_ASOF=j.asof;
    return n>0||!!j.asof;
  }catch(e){return false}
}

function expoWhen(x){
  if(x.none)return null;
  const T=+TODAY,d=s=>new Date(s+'T00:00:00');
  if(x.next){const a=d(x.next[0]),b=d(x.next[1]);if(+b>=T)return{a,b,sure:true}}
  if(x.last&&+d(x.last[1])>=T)return{a:d(x.last[0]),b:d(x.last[1]),sure:true};
  if(x.unk||!x.m.length)return null;
  /* 주기를 고려해 다음 개최 달을 추정 */
  const base=x.last?d(x.last[0]):(x.next?d(x.next[0]):null);let y=TODAY.getFullYear(),mo=x.m[0]-1;
  let cand=new Date(y,mo,15);if(+cand<T)cand=new Date(y+1,mo,15);
  if(/격년/.test(x.cyc)&&base){while((cand.getFullYear()-base.getFullYear())%2!==0)cand=new Date(cand.getFullYear()+1,mo,15)}
  return{a:cand,b:cand,sure:false};
}

       const w=expoWhen(x),pm=w&&w.sure?w.a.getMonth():-1;
       return `<div class="xr"><div class="xn"><span class="code">${x.c}</span> <b>${esc(x.n)}</b><div class="note">${esc(x.city)} · ${esc(x.cyc)}</div></div>${Array.from({length:12},(_,i)=>`<div class="xc ${i===M?'cur':''}">${x.m.includes(i+1)?`<span class="xb ${x.unk?'unk':''} ${({'파트너링':'pt','원료·CDMO':'den','바이오':'ivd','포장·제조':'mfg'})[(x.f||[])[0]]||''}"></span>`:''}${i===pm?`<i class="xd" title="${fmt(w.a)}"></i>`:''}</div>`).join('')}</div>`}).join('')+
     `<div class="legend" style="margin-top:12px"><span><i style="background:var(--accent)"></i>종합</span><span><i style="background:var(--mint)"></i>파트너링</span><span><i style="background:var(--c2)"></i>바이오</span><span><i style="background:var(--c4)"></i>원료·CDMO</span><span><i style="background:var(--c7)"></i>포장·제조</span><span><i style="background:var(--ink)"></i>확정된 다음 회차</span></div>`;
    const ul=list.filter(x=>!x.none).map(x=>({x,w:expoWhen(x)})).sort((a,b)=>(a.w?+a.w.a:9e15)-(b.w?+b.w.a:9e15));
    $('#xlist').innerHTML=ul.slice(0,more?99:8).map(({x,w})=>{const dl=w?dleft(w.a):null,live=w&&w.sure&&dl<=0&&dleft(w.b)>=0,r=rel(x);
      const when=!w?'일정 미확인':w.sure?`${fmt(w.a)} – ${fmt(w.b).slice(5)}`:`${w.a.getFullYear()}년 ${w.a.getMonth()+1}월경 (예상)`;
      const badge=!w?pill('plain','확인 필요'):live?pill('ok','진행 중'):w.sure?pill(dl<=30?'crit':dl<=90?'warn':'info',ddl(dl)):pill('plain','예상');
      return `<article class="xcard ${live?'live':''}"><div class="hstack" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><div><span class="code">${x.c}</span> <b>${esc(x.n)}</b> <span class="note">${esc(x.ko)}</span></div>${badge}</div>
       <div class="xmeta"><span>${ic('licenses','ico sm')}${when}</span><span>${ic('market','ico sm')}${esc(x.city)} · ${esc(x.venue)}</span></div>
       <div class="hstack" style="gap:6px;flex-wrap:wrap;margin-top:6px">${(x.f||[]).map(f=>`<span class="pill plain">${f}</span>`).join('')}${r.length?`<span class="pill ok">내 품목: ${r.join('·')}</span>`:''}${trade.has(x.c)?'<span class="pill info">거래 중인 나라</span>':''}${x.risk?'<span class="pill crit">제재 확인</span>':''}<span class="note" style="margin-left:auto">${qL[x.q]}</span></div>
       ${x.tip?`<p class="note" style="margin:6px 0 0">${x.tip}</p>`:''}${x.url?`<a class="lnk" href="${x.url}" target="_blank" rel="noopener" style="font-size:13px">공식 사이트 ${ic('ext','ico sm')}</a>`:''}</article>`}).join('')+(ul.length>8&&!more?`<button class="btn" id="xmore" style="align-self:center">박람회 ${ul.length-8}개 더 보기</button>`:'')||'<p class="note">조건에 맞는 박람회가 없습니다.</p>';
    if($('#xmore'))$('#xmore').onclick=()=>{more=true;draw()};
    const cands=up.filter(o=>o.w.sure&&dleft(o.w.a)>7).sort((a,b)=>a.w.a-b.w.a);
    if(!prepSel||!cands.some(o=>o.x.n===prepSel))prepSel=(cands.find(o=>dleft(o.w.a)>=150)||cands[0]||{x:{}}).x.n;
    const nx=cands.find(o=>o.x.n===prepSel);
    if(nx){const a=nx.w.a,st=(t,d,k)=>{const dt=new Date(+a-(k===6?-7:[0,180,120,60,30,7][k])*864e5),past=dleft(dt)<0;return `<li style="${past?'opacity:.55':''}"><span class="sn">${k}</span><div><b>${t}</b><div class="note" style="color:var(--ink-2)">${d}</div></div><span class="pill ${past?'plain':'info'}">${past?'지남 · ':''}${fmt(dt).slice(2)}</span></li>`};
      $('#xprepT').innerHTML=`<label class="note" for="xps">기준 박람회</label><select id="xps" style="width:100%;height:38px;margin:4px 0 6px">${cands.map(o=>`<option ${o.x.n===prepSel?'selected':''} value="${esc(o.x.n)}">${fmt(o.w.a).slice(2)} · ${esc(o.x.n)} (${COUNTRY[o.x.c]})</option>`).join('')}</select>개막일 ${fmt(a)} 기준으로 거꾸로 계산한 일정입니다. 지난 단계는 흐리게 표시됩니다.`;
      $('#xps').onchange=e=>{prepSel=e.target.value;draw()};
      $('#xprep').innerHTML=[['참가 결정·한국관 신청','KOTRA·보건산업진흥원 한국관 모집 공고 확인, 부스 위치 확보',1],['인허가·자료 준비','수출국 인증 현황 정리, 영문 카탈로그·IFU·인증서 사본 준비',2],['바이어 사전 매칭','대리점 후보 리스트업, 상담 일정 예약(주최 측 매칭 서비스 활용)',3],['물류·샘플 발송','전시품 ATA 까네(일시 수출입 통관) 또는 샘플 운송 확정',4],['현장 운영 점검','상담 기록 양식, 가격표(인코텀즈별), 명함·QR 준비',5],['사후 관리','1주 안에 상담 내용 정리·견적 발송, 노트에 후속 일정 기록',6]].map(([t,d,k])=>st(t,d,k)).join('')}
  }
  $('#xcont').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cont=b.dataset.c;store.set('aph-xcont',cont);more=false;$$('#xcont .chip').forEach(c=>c.setAttribute('aria-pressed',c===b));draw()};
  $('#xf').onchange=e=>{fil=e.target.value;store.set('aph-xf',fil);draw()};
  draw();
  loadExpoUpdates().then(ok=>{if(ok&&CUR&&CUR.id==='expos'&&document.getElementById('xchk'))draw()});
},()=>EXPOS.filter(x=>{const w=expoWhen(x);return w&&w.sure&&dleft(w.a)<=30&&dleft(w.b)>=0}).length);

/* ============ 제약 신규 모듈 1: 허가 진행 · GMP · 특허 · 증명서 ============ */
const dayTxt=(n)=>n===0?'오늘':n>0?`D-${n}`:`D+${-n}`;
const dField=(r,k)=>r[k]?fd(pd(r[k])):'—';
def('regtrack','인허가 · 규제','허가 진행 관리','제품 × 국가별 허가 신청의 제출일, 목표 승인일, 다음 할 일을 기록하고 지연 위험을 한눈에 봅니다.',root=>{
  let flt=store.get('aph-rtf','진행 중');
  const act=r=>['제출','심사 중','보완 요청'].includes(r.stage);
  const risk=r=>!act(r)?0:r.tgt<0?3:r.stage==='보완 요청'?2:r.tgt<=60?1:0;
  const cnt=f=>REGTRACK.filter(f).length;
  root.innerHTML=head('인허가 · 규제','허가 진행 관리',CUR.desc)+`<div class="kpis" id="rtk"></div>
  <section class="card"><div class="card-h"><div class="chips" id="rtf">${['진행 중','전체','준비','승인','반려·철회'].map(t=>`<button class="chip" aria-pressed="${t===flt}">${t}</button>`).join('')}</div>${addBtn('regtrack')}</div><div id="rtt"></div></section>
  <section class="card"><div class="card-h"><h2 class="ct">참고 · 일반적인 심사 기간</h2><span class="sub">허가 유형·보완 요청 횟수에 따라 크게 달라집니다. 직접 기록한 값이 더 정확합니다.</span></div>
  <div class="tbl"><table class="data"><thead><tr><th>지역</th><th>경로</th><th>공식 기준</th><th>현실적으로 고려할 점</th></tr></thead><tbody>
  <tr><td>미국 FDA</td><td>ANDA</td><td>GDUFA 목표: 표준 접수 후 약 10개월</td><td>보완 요청(CRL·IR)이 오면 한 번에 수개월씩 늘어납니다. 제조소 실사 일정도 변수입니다.</td></tr>
  <tr><td>EU EMA</td><td>중앙 절차</td><td>평가 210일(active days) + 중간 정지(clock stop)</td><td>질의 회신에 쓴 시간은 210일에 포함되지 않아 전체 1년 이상이 일반적입니다.</td></tr>
  <tr><td>그 외 국가</td><td>—</td><td>국가·유형별로 상이 <span class="note">(확인 필요)</span></td><td>대리인·현지 GMP 실사·샘플 시험 요구에 따라 1–3년이 걸리는 일이 많습니다.</td></tr></tbody></table></div></section>`;
  const draw=()=>{
    $('#rtk').innerHTML=[['진행 중',cnt(act),'ok'],['보완 요청',cnt(r=>r.stage==='보완 요청'),'warn'],['목표일 경과',cnt(r=>risk(r)===3),'crit'],['60일 안에 목표',cnt(r=>act(r)&&r.tgt>=0&&r.tgt<=60),'info']].map(x=>`<div class="kpi"><span class="l">${x[0]}</span><span class="v" style="color:var(--${x[1]?x[2]:'muted'})">${x[1]}건</span></div>`).join('');
    if(!REGTRACK.length){$('#rtt').innerHTML=emptyState('approvals','등록된 허가 건이 없습니다','제품, 국가, 제출일, 목표 승인일을 입력하면 경과일과 지연 위험을 계산합니다.','regtrack');return}
    const m={'진행 중':act,'전체':()=>true,'준비':r=>r.stage==='준비','승인':r=>r.stage==='승인','반려·철회':r=>r.stage==='반려·철회'}[flt];
    const rows=REGTRACK.filter(m).sort((a,b)=>risk(b)-risk(a)||a.tgt-b.tgt);
    if(!rows.length){$('#rtt').innerHTML=`<div class="empty"><b>조건에 맞는 건이 없습니다</b></div>`;return}
    $('#rtt').innerHTML=`<div class="tbl"><table class="data"><thead><tr><th>제품</th><th>국가 / 기관</th><th>경로</th><th>단계</th><th style="min-width:150px">진행</th><th>목표 승인일</th><th>다음 할 일</th></tr></thead><tbody>${rows.map(r=>{
      const rk=risk(r),el=-r.sub,tot=Math.max(1,el+Math.max(r.tgt,0)),pct=act(r)?clamp(el/tot,0,1)*100:r.stage==='승인'?100:0;
      const sp=r.stage==='승인'?pill('ok','승인'):r.stage==='반려·철회'?pill('crit','반려·철회'):r.stage==='준비'?pill('plain','준비'):r.stage==='보완 요청'?pill('warn','보완 요청'):pill('info',r.stage);
      const rp=rk===3?pill('crit','목표일 경과'):rk===2?pill('warn','회신 기한 확인'):rk===1?pill('info','목표 임박'):'';
      return `<tr class="click" data-rid="${r._id}"><td><b>${esc(P(r.p).short)}</b></td><td><span class="code">${r.c}</span> ${esc(r.auth||'')}<div class="note">${esc(COUNTRY[r.c]||'')}</div></td><td>${esc(r.path||'')}</td><td>${sp} ${rp}</td>
      <td><div class="meter" style="height:8px"><span style="width:${pct}%;background:var(--${rk===3?'crit':rk===2?'warn':'accent'})"></span></div><div class="note">${r.stage==='준비'?`제출 예정 ${dayTxt(r.sub)}`:r.stage==='승인'||r.stage==='반려·철회'?'—':`제출 후 ${nf(Math.max(el,0))}일`}</div></td>
      <td class="mono">${dField(r,'tgtDate')}<div class="note">${act(r)||r.stage==='준비'?dayTxt(r.tgt):''}</div></td><td>${esc(r.next||'—')}${r.memo?`<div class="note">${esc(r.memo.slice(0,50))}</div>`:''}</td></tr>`}).join('')}</tbody></table></div>`};
  $('#rtf').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;flt=c.textContent;store.set('aph-rtf',flt);$$('#rtf .chip').forEach(x=>x.setAttribute('aria-pressed',x===c));draw()};
  root.onclick=e=>{const tr=e.target.closest('tr[data-rid]');if(tr&&!e.target.closest('[data-edit]')){const r=REGTRACK.find(x=>x._id===tr.dataset.rid);if(r)openEditor('regtrack',r)}};
  draw();
},()=>REGTRACK.filter(r=>['제출','심사 중','보완 요청'].includes(r.stage)&&r.tgt<0).length);

def('gmp','인허가 · 규제','GMP · 제조소 관리','제조소별 GMP 인증서, 마지막 실사 결과, 지적 사항 회신 상태를 관리합니다. 허가 심사와 수출 증명서는 제조소 GMP에 묶여 있습니다.',root=>{
  const bad=r=>['483 회신 중','OAI·경고장'].includes(r.res);
  const cnt=f=>GMPS.filter(f).length;
  root.innerHTML=head('인허가 · 규제','GMP · 제조소 관리',CUR.desc)+`<div class="kpis" id="gk"></div>
  <section class="card"><div class="card-h"><h2 class="ct">제조소 목록</h2>${addBtn('gmp')}</div><div id="gt"></div></section>
  <div class="callout"><b>FDA 실사 결과 분류</b>NAI(지적 없음) · VAI(자발적 시정 필요) · OAI(공식 조치 가능). Form 483은 실사 종료 시 받는 관찰 사항이며, 보통 15영업일 안에 서면 회신합니다. 외국 제조소는 FDA 사전 승인 실사(PAI) 결과가 ANDA 승인에 영향을 줍니다. 회신 기한은 통지서를 확인하세요.</div>`;
  $('#gk').innerHTML=[['제조소',GMPS.length,'info'],['인증서 만료·90일 내',cnt(r=>r.exp<=90),'crit'],['지적 회신 진행',cnt(bad),'warn'],['마지막 실사 2년 초과',cnt(r=>r.last<-730),'warn']].map(x=>`<div class="kpi"><span class="l">${x[0]}</span><span class="v" style="color:var(--${x[1]?x[2]:'muted'})">${x[1]}${x[0]==='제조소'?'곳':'건'}</span></div>`).join('');
  $('#gt').innerHTML=GMPS.length?`<div class="tbl"><table class="data"><thead><tr><th>제조소</th><th>구분</th><th>기관</th><th>최근 실사</th><th>결과</th><th>인증서 만료</th><th></th></tr></thead><tbody>${[...GMPS].sort((a,b)=>a.exp-b.exp).map(r=>{
    const rs=r.res==='적합'?pill('ok','적합'):r.res==='경미 지적'?pill('info',r.res):r.res==='실사 예정'?pill('plain',r.res):pill(r.res==='OAI·경고장'?'crit':'warn',r.res);
    const ex=r.exp<0?pill('crit','만료 '+dayTxt(r.exp)):r.exp<=90?pill('warn',dayTxt(r.exp)):pill('ok',dayTxt(r.exp));
    return `<tr class="click" data-rid="${r._id}"><td><b>${esc(r.site)}</b><div class="note">${esc(r.no||'')}</div></td><td>${esc(r.kind)}<div class="note">${r.c}</div></td><td>${esc(r.auth||'')}</td><td class="mono">${dField(r,'lastDate')}<div class="note">${r.last<-730?'2년 초과':''}</div></td><td>${rs}${r.memo?`<div class="note">${esc(r.memo.slice(0,40))}</div>`:''}</td><td class="mono">${dField(r,'expDate')}</td><td>${ex}</td></tr>`}).join('')}</tbody></table></div>`:emptyState('gmp','등록된 제조소가 없습니다','제조소, 인증서 만료일, 최근 실사 결과를 기록하세요.','gmp');
  root.onclick=e=>{const tr=e.target.closest('tr[data-rid]');if(tr){const r=GMPS.find(x=>x._id===tr.dataset.rid);if(r)openEditor('gmp',r)}};
},()=>GMPS.filter(r=>r.exp<=30||['483 회신 중','OAI·경고장'].includes(r.res)).length);

def('patent','인허가 · 규제','특허 · 독점권 달력','제품·국가별로 시판을 막는 특허와 독점 기간의 만료일을 모아 가장 늦은 종료일(진입 가능 예상일)을 계산합니다.',root=>{
  root.innerHTML=head('인허가 · 규제','특허 · 독점권 달력',CUR.desc)+`<div class="callout warn"><b>예시 기록입니다</b>화면의 특허번호와 날짜는 가상 값입니다. 실제 값은 미국은 FDA Orange Book(저분자)·Purple Book(바이오), 한국은 식약처 의약품특허목록, EU는 각국 특허청·SPC 정보로 확인하고, 최종 판단은 변리사·특허 변호사와 하세요.</div>
  <section class="card"><div class="card-h"><h2 class="ct">진입 가능 예상일</h2>${addBtn('patent')}</div><div id="pt"></div></section>
  <section class="card"><div class="card-h"><h2 class="ct">참고 · 미국의 일반 원칙</h2></div><div class="tbl"><table class="data"><tbody>
  <tr><td>신화학물질(NCE) 독점</td><td>5년 (ANDA 제출은 4년 뒤부터 가능, 특허 도전 시)</td></tr>
  <tr><td>신규 임상 독점</td><td>3년</td></tr><tr><td>희귀의약품 독점</td><td>7년</td></tr><tr><td>바이오의약품 참조제품 독점</td><td>12년 (바이오시밀러 신청은 4년 뒤부터 가능)</td></tr>
  <tr><td>Paragraph IV 인증</td><td>특허 무효·비침해 주장 → 특허권자 소송 시 최대 30개월 자동 정지, 최초 제출자에게 180일 독점 가능</td></tr></tbody></table></div><p class="note" style="margin:8px 0 0">출처: FDA·Hatch-Waxman 법·BPCIA 일반 원칙. 개별 사건은 다를 수 있습니다.</p></section>`;
  const SPAN=365*9;
  const g={};PATENTS.forEach(r=>{(g[r.p+'|'+r.c]=g[r.p+'|'+r.c]||[]).push(r)});
  const keys=Object.keys(g).sort((a,b)=>Math.max(...g[a].map(r=>r.exp))-Math.max(...g[b].map(r=>r.exp)));
  $('#pt').innerHTML=keys.length?keys.map(k=>{const rs=g[k].sort((a,b)=>a.exp-b.exp),[p,c]=k.split('|'),last=Math.max(...rs.map(r=>r.exp)),free=last<0;
    return `<div class="subcard" style="margin-bottom:12px"><div class="card-h" style="margin:0 0 8px"><div><b>${esc(P(p).short)}</b> <span class="code">${c}</span></div>${free?pill('ok','등록된 장벽 모두 종료'):pill(last<=730?'warn':'info',`예상 진입 ${fd(addDays(TODAY,last))} · ${dayTxt(last)}`)}</div>

def('certs','무역 서류','수출 증명서 관리','CPP, GMP 증명서, 자유판매증명서(FSC), 로트별 CoA를 신청부터 만료까지 추적합니다. 국가마다 요구하는 서류와 유효기간이 다릅니다.',root=>{
  root.innerHTML=head('무역 서류','수출 증명서 관리',CUR.desc)+`<div class="kpis" id="ck"></div>

  const has=r=>!!r.expDate,dl=r=>has(r)?r.exp:null;

  $('#ck').innerHTML=[['발급 완료',cnt(r=>r.stat==='발급 완료'),'ok'],['신청 중',cnt(r=>r.stat==='신청'),'info'],['30일 안에 만료',cnt(r=>has(r)&&r.exp>=0&&r.exp<=30),'warn'],['만료·갱신 필요',cnt(r=>r.stat==='갱신 필요'||(has(r)&&r.exp<0)),'crit']].map(x=>`<div class="kpi"><span class="l">${x[0]}</span><span class="v" style="color:var(--${x[1]?x[2]:'muted'})">${x[1]}건</span></div>`).join('');
  let f='전체';
  const draw=()=>{if(!CERTS.length){$('#ct2').innerHTML=emptyState('certs','등록된 증명서가 없습니다','증명서 종류, 제품, 국가, 만료일을 기록하세요.','certs');return}
    const m={'전체':()=>true,'신청 중':r=>r.stat==='신청'||r.stat==='준비','만료·갱신 필요':r=>r.stat==='갱신 필요'||(has(r)&&r.exp<=30)}[f];
    const rows=CERTS.filter(m).sort((a,b)=>(dl(a)??9e5)-(dl(b)??9e5));
    $('#ct2').innerHTML=`<div class="tbl"><table class="data"><thead><tr><th>종류</th><th>제품 / 국가</th><th>번호</th><th>상태</th><th>발급일</th><th>만료일</th><th></th></tr></thead><tbody>${rows.map(r=>{
      const sp=r.stat==='발급 완료'?pill('ok',r.stat):r.stat==='갱신 필요'?pill('crit',r.stat):pill('info',r.stat);
      const ex=!has(r)?'':r.exp<0?pill('crit','만료 '+dayTxt(r.exp)):r.exp<=30?pill('warn',dayTxt(r.exp)):pill('ok',dayTxt(r.exp));
      return `<tr class="click" data-rid="${r._id}"><td><b>${esc(r.kind)}</b>${r.memo?`<div class="note">${esc(r.memo.slice(0,44))}</div>`:''}</td><td>${esc(P(r.p).short)} <span class="code">${r.c}</span></td><td class="mono" style="word-break:break-all">${esc(r.no||'—')}</td><td>${sp}</td><td class="mono">${dField(r,'issDate')}</td><td class="mono">${dField(r,'expDate')}</td><td>${ex}</td></tr>`}).join('')}</tbody></table></div>`};

/* ============ 제약 신규 모듈 2: 약가 구조 · CTD · 라이선싱 · 마약류 ============ */
def('pricing','가격 · 관세','약가 · 가격 구조 계산기','수출가에서 시작해 운임·관세·수입자/도매/약국 마진·부가세를 거친 소비자 가격을 계산하고, 반대로 가격 상한에서 허용 수출가를 역산합니다.',root=>{
  if(!PRODUCTS.length){root.innerHTML=head(CUR.g,CUR.title,CUR.desc)+`<section class="card">${emptyState('landed','등록된 제품이 없습니다','가격 계산을 하려면 먼저 제품을 등록하세요.','products')}</section>`;return}
  const PRE={'민간 유통 (예시)':[6,2,12,10,25,0],'공공 구매·입찰 (예시)':[6,2,6,5,10,0],'마진 낮은 시장 (예시)':[6,2,8,6,15,0]};
  let mode='fwd',base='cost';
  root.innerHTML=head(CUR.g,CUR.title,CUR.desc)+`
  <div class="callout warn"><b>마진·부가세는 예시 값입니다</b>많은 나라가 도매·약국 마진과 최종 약가를 규제하고, 구조가 국가마다 다릅니다. 숫자는 시뮬레이션용이니 실제 구조는 현지 대리인과 약가 규정(예: 사우디 SFDA 가격 등록, 브라질 CMED)으로 확인하세요.</div>
  <div class="row"><section class="card c-5 stack">
   <div class="chips" id="pmode"><button class="chip" data-m="fwd" aria-pressed="true">수출가 → 소비자가</button><button class="chip" data-m="rev" aria-pressed="false">소비자 상한가 → 수출가</button></div>
   <div class="form">
    <div class="field"><label for="pp">제품</label><select id="pp">${PRODUCTS.map(p=>`<option value="${esc(p.id)}">${esc(p.short)}</option>`).join('')}</select></div>
    <div class="field"><label for="pc">국가</label><select id="pc">${MK.map(c=>`<option value="${c}" ${c==='SA'?'selected':''}>${COUNTRY[c]}</option>`).join('')}</select></div>
    <div class="field"><label for="pv" id="pvl">수출가 FOB/CIP (USD/개)</label><input id="pv" type="number" step=".01" value="${PRODUCTS[0].price||1}"></div>
    <div class="field"><label for="ppre">마진 구조</label><select id="ppre">${Object.keys(PRE).map(k=>`<option>${k}</option>`).join('')}<option>직접 입력</option></select></div>
    <div class="field"><label for="pf">운임·보험 (% of 수출가)</label><input id="pf" type="number" step=".5" value="6"></div>
    <div class="field"><label for="pd">관세 (%)</label><input id="pd" type="number" step=".5" value="0"><span class="note" id="pdn"></span></div>
    <div class="field"><label for="pcl">통관·현지 물류 (% of CIF)</label><input id="pcl" type="number" step=".5" value="2"></div>
    <div class="field"><label for="pim">수입자 마진 (%)</label><input id="pim" type="number" step=".5" value="12"></div>
    <div class="field"><label for="pwm">도매 마진 (%)</label><input id="pwm" type="number" step=".5" value="10"></div>
    <div class="field"><label for="ppm">약국 마진 (%)</label><input id="ppm" type="number" step=".5" value="25"></div>
    <div class="field"><label for="pvat">부가세 (%)</label><input id="pvat" type="number" step=".5" value="0"></div>
    <div class="field"><label for="pmt">마진 계산 방식</label><select id="pmt"><option value="m">원가 가산율 (markup)</option><option value="p">판매가 대비 (margin on price)</option></select></div>
   </div></section>
   <section class="card c-7 stack" id="pout"></section></div>`;
  const g=id=>+$('#'+id).value||0;
  function chain(){
    const mt=$('#pmt').value,mk=pc=>mt==='p'?1/(1-Math.min(pc,95)/100):1+pc/100;
    return [['수출가 (FOB/CIP)',1,'accent'],['운임·보험',1+g('pf')/100,'c2'],['관세',null,'c4'],['통관·현지 물류',null,'c3'],['수입자 마진',mk(g('pim')),'c1'],['도매 마진',mk(g('pwm')),'c5'],['약국 마진',mk(g('ppm')),'c7'],['부가세',1+g('pvat')/100,'muted']]}
  function calc(){
    const p=P($('#pp').value),usdNow=FX.USD.s[FX.USD.s.length-1],costU=p.cost/usdNow;
    const f=1+g('pf')/100,dut=g('pd')/100,cl=g('pcl')/100,mt=$('#pmt').value,mk=pc=>mt==='p'?1/(1-Math.min(pc,95)/100):1+pc/100;
    const mi=mk(g('pim')),mw=mk(g('pwm')),mp=mk(g('ppm')),vt=1+g('pvat')/100;
    let ex,cons;
    if(mode==='fwd'){ex=g('pv');cons=ex*f*(1+dut+cl)*mi*mw*mp*vt}
    else{cons=g('pv');ex=cons/(vt*mp*mw*mi*(1+dut+cl)*f)}
    const cif=ex*f,duty=cif*dut,clr=cif*cl,land=cif+duty+clr,imp=land*mi,ws=imp*mw,ph=ws*mp,vat=ph*(vt-1);
    const steps=[['수출가 (FOB/CIP)',ex,ex,'--accent'],['운임·보험',cif-ex,cif,'--c2'],['관세',duty,cif+duty,'--c4'],['통관·현지 물류',clr,land,'--c3'],['수입자 마진',imp-land,imp,'--c1'],['도매 마진',ws-imp,ws,'--c5'],['약국 마진',ph-ws,ph,'--c7'],['부가세',vat,ph+vat,'--ink-2']];
    const gm=ex>0?(ex-costU)/ex:0;
    $('#pvl').textContent=mode==='fwd'?'수출가 FOB/CIP (USD/개)':'소비자 상한가 (USD/개)';
    $('#pout').innerHTML=`<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><span class="l">${mode==='fwd'?'소비자 가격':'허용 수출가'}</span><span class="v">${usd(mode==='fwd'?cons:ex,2)}</span><span class="d">${mode==='fwd'?`수출가의 ${(cons/ex).toFixed(2)}배`:`상한가 ${usd(cons,2)} 기준`}</span></div>
     <div class="kpi"><span class="l">수출자 몫</span><span class="v">${cons>0?(ex/cons*100).toFixed(0):0}%</span><span class="d">소비자 가격 중 우리에게 오는 비율</span></div>
     <div class="kpi"><span class="l">우리 매출총이익률</span><span class="v ${gm<0?'down':gm<.15?'':'up'}" style="${gm<.15?'color:var(--'+(gm<0?'crit':'warn')+')':''}">${(gm*100).toFixed(0)}%</span><span class="d">원가 ${usd(costU,2)}/개 (환율 ${nf(usdNow,1)}원)</span></div></div>
     <div class="tbl"><table class="data"><thead><tr><th>단계</th><th class="r">증가분</th><th class="r">누적 가격</th><th style="width:34%">소비자가 대비</th></tr></thead><tbody>${steps.map(s=>`<tr><td>${s[0]}</td><td class="r mono">${s[0].startsWith('수출가')?'—':usd(s[1],2)}</td><td class="r mono"><b>${usd(s[2],2)}</b></td><td><div class="meter" style="height:7px"><span style="width:${cons>0?clamp(s[2]/cons*100,0,100):0}%;background:var(${s[3]})"></span></div></td></tr>`).join('')}</tbody></table></div>
     ${gm<.1?`<div class="callout ${gm<0?'crit':'warn'}"><b>${gm<0?'원가 아래입니다':'마진이 얇습니다'}</b>${mode==='rev'?'이 상한가에서는 현재 마진 구조를 유지하기 어렵습니다. 도매·약국 마진이 정해져 있다면 수출가를 낮추거나 시장 진입 가격을 재검토하세요.':'수출가를 올리거나 운임·관세 부담을 줄일 방법(FTA, 인코텀즈)을 확인하세요.'}</div>`:''}
     <p class="note" style="margin:0">관세는 선택한 국가의 HS ${esc(p.hs||'—')} 기준 일반 세율을 불러온 참고값입니다. 가격·마진 규정은 확인 필요.</p>`;
  }
  function loadDuty(){const p=P($('#pp').value),c=$('#pc').value;let r=0;try{r=rateOf(c,p.hs)[0]||0}catch(e){}$('#pd').value=r;$('#pdn').textContent=`참고: ${COUNTRY[c]} MFN ${r}% (HS ${p.hs||'—'})`;}
  function preset(){const k=$('#ppre').value,v=PRE[k];if(!v)return;['pf','pcl','pim','pwm','ppm','pvat'].forEach((id,i)=>$('#'+id).value=v[i])}
  $('#pp').onchange=()=>{if(mode==='fwd')$('#pv').value=P($('#pp').value).price||1;loadDuty();calc()};
  $('#pc').onchange=()=>{loadDuty();calc()};
  $('#ppre').onchange=()=>{preset();calc()};
  $('#pmode').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;mode=b.dataset.m;$$('#pmode .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#pv').value=mode==='fwd'?(P($('#pp').value).price||1):(+((P($('#pp').value).price||1)*9).toFixed(2));calc()};
  root.addEventListener('input',e=>{if(['pf','pcl','pim','pwm','ppm','pvat','pd'].includes(e.target.id)&&e.target.id!=='pd')$('#ppre').value='직접 입력';calc()});
  loadDuty();preset();calc();
});

def('ctd','인허가 · 규제','CTD 제출 자료 체크리스트','ICH CTD 5개 모듈(M1–M5) 기준으로 제품별 제출 자료 준비 상태를 점검합니다. 제네릭은 M4·M5 대부분이 면제되고, 바이오시밀러는 비교 자료가 핵심입니다.',root=>{

  const kindOf=p=>catOf(p)==='바이오의약품'||catOf(p)==='백신'?2:1;
  const rel=(it,k)=>it[1]===0||it[1]===2&&k===2||it[1]===1&&k===2;
  function draw(){const p=P(pid),k=kindOf(p),st=CTD[pid]||(CTD[pid]={});let all=0,done=0;
    $('#ctl').innerHTML=`<div class="card-h"><div><h2 class="ct">${esc(p.short)} · CTD</h2><div class="sub">${k===2?'바이오 제품: 품질·비임상·임상 비교 자료가 모두 필요할 수 있습니다':'제네릭 제품: M4·M5는 대부분 BE 시험으로 대체 (국가별 확인 필요)'}</div></div></div>`+CTD_MOD.map(([m,t,items],mi)=>{
      const use=items.map((it,i)=>[it,i]).filter(([it])=>k===2||it[1]!==2);
      const d=use.filter(([it,i])=>(st[m+i]||{}).ok).length;all+=use.length;done+=d;
      return `<div style="margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center"><b>${m} · ${t}</b>${pill(d===use.length?'ok':'plain',d+' / '+use.length)}</div>`+use.map(([it,i])=>{const o=st[m+i]||{};const opt=k===1&&it[1]===1;
        return `<div class="chk"><input type="checkbox" id="ct_${m}${i}" data-k="${m}${i}" ${o.ok?'checked':''}><label for="ct_${m}${i}"><span>${it[0]}</span>${opt?'<span class="note"> · 제네릭은 면제 가능</span>':''}</label><input class="mini-select" data-memo="${m}${i}" placeholder="메모" value="${esc(o.memo||'')}"></div>`}).join('')}).join('');
    const pct=all?Math.round(done/all*100):0;
    $('#cts').innerHTML=`<h2 class="ct">준비율</h2><div class="hstack" style="gap:16px;flex-wrap:nowrap">${donut([{label:'완료',value:done||.001,c:'--accent'},{label:'남음',value:all-done||.001,c:'--sunken'}],120,`<text x="60" y="66" text-anchor="middle" style="fill:var(--ink);font-size:20px;font-weight:700">${pct}%</text>`)}<div class="note">${done} / ${all}개 항목</div></div>
    <div class="callout"><b>제출 전 확인</b>국가마다 CTD 전체(ICH 지역)·부분 형식, 번역 범위, 전자 제출(eCTD) 여부가 다릅니다. 현지 대리인과 가이드라인을 확인하세요.</div>`}
  root.addEventListener('change',e=>{const t=e.target;if(t.id==='ctp'){pid=t.value;store.set('aph-ctdp',pid);draw();return}
    if(t.dataset.k){const st=CTD[pid]||(CTD[pid]={});st[t.dataset.k]={...(st[t.dataset.k]||{}),ok:t.checked};persist('ctd');draw()}
    else if(t.dataset.memo){const st=CTD[pid]||(CTD[pid]={});st[t.dataset.memo]={...(st[t.dataset.memo]||{}),memo:t.value};persist('ctd')}});
  draw();
});

def('licdeal','영업 · 채널','라이선싱 딜 시뮬레이터','선급금·마일스톤·로열티로 이뤄진 라이선스 아웃 계약의 총 규모와 위험 조정 가치(rNPV)를 계산합니다. 숫자는 가정이며 투자·협상 조언이 아닙니다.',root=>{
  const MS=[['계약 체결 (선급금)',5,0,100],['3상 임상 개시',10,2,70],['허가 신청',15,4,50],['최초 상업 출시',25,5,40],['연 매출 목표 달성',50,8,25]];
  root.innerHTML=head(CUR.g,CUR.title,CUR.desc)+`
  <div class="callout warn"><b>가정 기반 모델입니다</b>마일스톤 금액과 확률, 최대 매출은 모두 입력한 가정입니다. 실제 계약은 지역·적응증별 분할, 로열티 단계(tiered), 세금 원천징수가 달라질 수 있습니다.</div>
  <div class="row"><section class="card c-6 stack"><h2 class="ct">계약 조건 (단위: 백만 USD)</h2>
   <div class="tbl"><table class="data"><thead><tr><th>항목</th><th class="r">금액</th><th class="r">시점(년)</th><th class="r">성공확률 %</th></tr></thead><tbody>${MS.map((m,i)=>`<tr><td>${m[0]}</td><td class="r"><input class="heat-in" data-r="${i}" data-f="1" type="number" step="1" value="${m[1]}"></td><td class="r"><input class="heat-in" data-r="${i}" data-f="2" type="number" step="1" value="${m[2]}"></td><td class="r"><input class="heat-in" data-r="${i}" data-f="3" type="number" step="5" value="${m[3]}"></td></tr>`).join('')}</tbody></table></div>
   <div class="form">
    <div class="field"><label for="lr">로열티율 (%)</label><input id="lr" type="number" step=".5" value="10"></div>
    <div class="field"><label for="lp">최대 연 매출 (백만 USD)</label><input id="lp" type="number" step="10" value="500"></div>
    <div class="field"><label for="ll">출시 시점 (계약 후 년)</label><input id="ll" type="number" step="1" value="5"></div>
    <div class="field"><label for="lrp">매출 정점까지 (년)</label><input id="lrp" type="number" step="1" value="4"></div>
    <div class="field"><label for="lx">독점·특허 보호기간 (출시 후 년)</label><input id="lx" type="number" step="1" value="10"></div>
    <div class="field"><label for="lpos">출시 성공 확률 (%)</label><input id="lpos" type="number" step="5" value="40"></div>
    <div class="field"><label for="ld">할인율 (%)</label><input id="ld" type="number" step=".5" value="12"></div></div></section>
   <section class="card c-6 stack" id="lout"></section></div>`;
  const g=id=>+$('#'+id).value||0;
  function model(peakMul){
    const ms=$$('tr',root).filter(r=>r.querySelector('[data-r]')).map(r=>[...r.querySelectorAll('input')].map(i=>+i.value||0));
    const rate=g('lr')/100,peak=g('lp')*peakMul,L=g('ll'),ramp=Math.max(1,g('lrp')),X=g('lx'),pos=g('lpos')/100,dr=g('ld')/100,N=Math.max(25,L+X+2);
    const cf=Array.from({length:N+1},()=>({m:0,r:0,mR:0,rR:0}));
    ms.forEach(([a,y,pr],i)=>{y=clamp(Math.round(y),0,N);cf[y].m+=a;cf[y].mR+=a*pr/100});
    for(let k=0;k<X;k++){const y=L+k;if(y>N)break;const sales=peak*Math.min(1,(k+1)/ramp);cf[y].r+=sales*rate;cf[y].rR+=sales*rate*pos}
    const tot=cf.reduce((a,c)=>a+c.m+c.r,0),msTot=cf.reduce((a,c)=>a+c.m,0),royTot=cf.reduce((a,c)=>a+c.r,0);
    const rnpv=cf.reduce((a,c,t)=>a+(c.mR+c.rR)/Math.pow(1+dr,t),0);
    return{cf,tot,msTot,royTot,rnpv,ms,peak}}
  function calc(){const m=model(1),up=m.ms[0]?m.ms[0][0]:0;
    const mx=Math.max(1,...m.cf.map(c=>c.m+c.r));
    $('#lout').innerHTML=`<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><span class="l">헤드라인 총액 (성공 가정)</span><span class="v">${usd(m.tot*1e6/1e6,0)}M</span><span class="d">마일스톤 ${usd(m.msTot,0)}M + 로열티 ${usd(m.royTot,0)}M</span></div>
     <div class="kpi"><span class="l">위험 조정 가치 (rNPV)</span><span class="v">${usd(m.rnpv,1)}M</span><span class="d">확률·할인 반영</span></div>
     <div class="kpi"><span class="l">선급금 비중 (rNPV 대비)</span><span class="v">${m.rnpv>0?Math.round(up/m.rnpv*100):0}%</span><span class="d">확정 수령 비중 — 높을수록 안전</span></div>
     <div class="kpi"><span class="l">로열티 비중 (총액 대비)</span><span class="v">${m.tot>0?Math.round(m.royTot/m.tot*100):0}%</span><span class="d">출시·매출 성공에 의존</span></div></div>
     <h2 class="ct" style="margin-top:6px">연도별 수령액 (성공 가정, 백만 USD)</h2>
     <div style="display:flex;align-items:flex-end;gap:3px;height:120px">${m.cf.map((c,t)=>{const v=c.m+c.r;return `<div title="${t}년차: ${usd(v,1)}M" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%"><div style="height:${v/mx*100}%;min-height:${v?2:0}px;border-radius:3px 3px 0 0;background:linear-gradient(0deg,var(--accent),var(--mint))"></div></div>`}).join('')}</div>
     <div class="note" style="display:flex;justify-content:space-between"><span>0년</span><span>${m.cf.length-1}년</span></div>
     <h2 class="ct">시나리오 (최대 매출 변화)</h2>
     <div class="tbl"><table class="data"><thead><tr><th>시나리오</th><th class="r">최대 매출</th><th class="r">로열티 합계</th><th class="r">rNPV</th></tr></thead><tbody>${[['비관 ×0.5',.5],['기준 ×1',1],['낙관 ×1.5',1.5]].map(([n,k])=>{const x=model(k);return `<tr><td>${n}</td><td class="r mono">${usd(x.peak,0)}M</td><td class="r mono">${usd(x.royTot,0)}M</td><td class="r mono"><b>${usd(x.rnpv,1)}M</b></td></tr>`}).join('')}</tbody></table></div>
     <p class="note" style="margin:0">rNPV = Σ (마일스톤 × 성공확률 + 로열티 × 출시확률) ÷ (1+할인율)^년. 세금·비용·환율은 반영하지 않았습니다.</p>`}
  root.addEventListener('input',calc);calc();
});

function cardify(){document.querySelectorAll('#view table.data:not(.heat):not(.mx):not(.grid)').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(hs.length<5)return;t.classList.add('cards');t.querySelectorAll('tbody tr').forEach(tr=>{if(tr.dataset.cd===String(tr.cells.length))return;tr.dataset.cd=tr.cells.length;if(tr.cells.length!==hs.length)return;[...tr.cells].forEach((td,i)=>td.setAttribute('data-label',hs[i]||''))})})}
let cardQ=0;new MutationObserver(()=>{if(cardQ)return;cardQ=requestAnimationFrame(()=>{cardQ=0;cardify()})}).observe(document.getElementById('view')||document.body,{childList:true,subtree:true});

function liveBox(m){
  const c=LIVEBOX[m.id];if(!c)return null;
  const d=document.createElement('section');d.className='card livebox';
  const rc=c.kind==='recall';
  d.innerHTML=`<div class="card-h"><div><h2 class="ct">${c.t}</h2><div class="sub">${c.d}</div></div></div>
  <div class="lb-ctl">${rc?`<label class="lb-f">기간<select id="lbDays"><option value="30">최근 30일</option><option value="90" selected>최근 90일</option><option value="180">최근 180일</option></select></label>
   <label class="lb-f">제품 단어(영문)<input id="lbQ" placeholder="예: insulin" maxlength="30"></label>
   <label class="lb-chk"><input type="checkbox" id="lbKr"> 한국 회사만</label>
   <button class="btn" id="lbGo" type="button">불러오기</button>`
   :c.topics.map(([k,n],i)=>`<button class="btn${i?'':' pri'}" data-t="${k}" type="button">${n} 불러오기</button>`).join('')}</div>
  <div id="lbOut" class="lb-out" aria-live="polite"></div>`;
  const out=d.querySelector('#lbOut');
  const msg=(cls,h)=>{out.innerHTML=`<div class="callout ${cls}">${h}</div>`};
  const list=(items,mk)=>`<div class="lb-list">${items.map(mk).join('')}</div>`;
  async function go(path){
    if(!API_BASE){msg('warn','<b>지금 보고 있는 Claude 미리보기에서는 외부 사이트에 접속할 수 없어 이 버튼이 동작하지 않습니다</b>오류가 아니라 미리보기의 제한입니다. Vercel에 배포한 사이트 주소(…vercel.app)에서 열어 누르면 실제 최신 정보를 가져옵니다.');return null}
    msg('','불러오는 중…');
    try{const r=await fetch(`${API_BASE}/${path}`,{headers:{Accept:'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
    catch(e){msg('crit',`<b>불러오지 못했습니다</b>${esc(e.message)}${/404/.test(e.message)?' · 배포한 저장소의 api 폴더에 recall.js, regwatch.js 가 들어 있는지 확인하세요.':''}`);return null}
  }
  if(rc){d.querySelector('#lbGo').onclick=async()=>{
    const q=new URLSearchParams({days:d.querySelector('#lbDays').value});const w=d.querySelector('#lbQ').value.trim();if(w)q.set('q',w);if(d.querySelector('#lbKr').checked)q.set('country','korea');
    const j=await go('recall?'+q);if(!j)return;
    if(!j.items.length){msg('warn',`<b>조건에 맞는 리콜이 없습니다</b>${j.from} ~ ${j.to} 사이 FDA 공개 데이터에서 찾지 못했습니다. 기간을 늘리거나 단어를 바꿔 보세요.`);return}
    out.innerHTML=`<p class="note" style="margin:0 0 8px">${esc(j.source)} · ${j.from} ~ ${j.to} 시작분 · 조건에 맞는 ${j.shown}건 표시 (기간 내 전체 ${nf(j.total)}건, 최신순 100건 중에서 선택) · 가져온 시각 ${esc(j.collected)}${j.dataUpdated?` · FDA 데이터 갱신 ${esc(j.dataUpdated)}`:''}</p>`+
    list(j.items,i=>`<a class="lb-item" href="${esc(i.url)}" target="_blank" rel="noopener"><div class="lb-h"><b>${esc(i.firm)}</b><span class="code">${esc(i.country||'—')}</span>${i.status?pill(/open/i.test(i.status)?'warn':'plain',esc(i.status)):''}${i.deviceClass?pill('info','Class '+esc(i.deviceClass)+' 회수'):''}</div><div class="lb-p">${esc(i.product)}</div><div class="lb-r">${esc(i.reason)}</div><div class="lb-m">${esc(i.date)}${i.specialty?' · '+esc(i.specialty):''}${i.qty?' · '+esc(i.qty):''}${i.id?' · '+esc(i.id):''} ↗</div></a>`)+
    `<p class="note" style="margin:10px 0 0">미국 FDA 공개 데이터로, 검증되지 않은 정보이며 의사결정의 근거로 쓰기 전에 원문을 확인해야 합니다. '기기 Class'는 기기 자체의 위험 등급이고, 리콜 Class(I·II·III)와는 다릅니다.</p>`}}
  else d.querySelectorAll('button[data-t]').forEach(b=>b.onclick=async()=>{
    const j=await go('regwatch?topic='+b.dataset.t);if(!j)return;
    out.innerHTML=`<p class="note" style="margin:0 0 8px">가져온 시각 ${esc(j.collected)} · 최신순 ${j.items.length}건${b.dataset.t==='fda'?' · 영문 원문':''}</p>`+
    list(j.items,i=>`<a class="lb-item" href="${esc(i.url)}" target="_blank" rel="noopener"><div class="lb-h"><b>${esc(i.title)}</b></div>${i.note?`<div class="lb-r">${esc(i.note)}</div>`:''}<div class="lb-m">${esc(i.date||'')} · ${esc(i.source)}${i.kind&&i.kind!=='기사'?' · '+esc(i.kind):''} ↗</div></a>`)+
    `<p class="note" style="margin:10px 0 0">기사·공고의 제목만 모은 목록입니다. 실제 규정이나 세율은 공식 출처에서 확인한 뒤 반영하세요.</p>`});
  if(API_BASE)setTimeout(()=>{const b=d.querySelector('#lbGo')||d.querySelector('button[data-t]');if(b)b.click()},60);
  return d;
}
function srcFoot(m){
  const s=SRCFOOT[m.id];if(!s)return null;
  const d=document.createElement('div');d.className='srcfoot';
  d.innerHTML=`<div class="sf-t"><b>기준일 ${ASOF}</b> · 직접 정리한 정보이며 자동으로 갱신되지 않습니다. ${agePill(ageDays(ASOF))}</div><div class="sf-n">${s[0]}</div>${s[1].length?`<div class="sf-l">${s[1].map(([n,u])=>`<a class="btn sm" href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join('')}</div>`:''}`;
  return d;
}
function route(keep){
  const id=(location.hash||'#dashboard').slice(1),m=MODS.find(x=>x.id===id)||MODS[0];
  CUR=m;charts=[];const v=$('#view');v.innerHTML='';const root=document.createElement('div');root.className='stack'+(keep?'':' view-in');root.style.gap='20px';v.appendChild(root);
  try{m.render(root)}catch(err){console.error(err);root.innerHTML=head(m.g,m.title,m.desc)+`<div class="callout crit"><b>이 화면을 그리지 못했습니다</b>입력한 기록 중 형식이 맞지 않는 값이 있을 수 있습니다. 해당 기록을 수정하거나 "내 정보 · 데이터 관리"에서 백업 후 되돌려 보세요.</div>`}
  try{const lb=liveBox(m);if(lb)v.appendChild(lb)}catch(e){console.error(e)}
  try{const sf=srcFoot(m);if(sf)v.appendChild(sf)}catch(e){}
  $$('.nav-item').forEach(a=>{if(a.dataset.id===m.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#crumbs').innerHTML=`<span class="g">${m.g}</span><span class="g">/</span><b>${m.title}</b>`;
  closeSide();if(!keep)window.scrollTo(0,0);store.set('aph-last',m.id);
}

function closeSide(){$('#side').classList.remove('open');$('#scrim').hidden=true}

/* 명령 팔레트 */
const cmdk=$('#cmdk'),cq=$('#cmdq'),cl=$('#cmdl');let cIdx=0,cRes=[];
function cmdRender(){const s=cq.value.trim().toLowerCase();cRes=MODS.filter(m=>!s||(m.title+m.desc+m.g+m.id).toLowerCase().includes(s));cIdx=Math.min(cIdx,Math.max(cRes.length-1,0));
  cl.innerHTML=cRes.map((m,i)=>`<button data-id="${m.id}" class="${i===cIdx?'on':''}">${ic(m.id)}<span>${m.title}</span><small>${m.g}</small></button>`).join('')||'<p class="note" style="padding:12px">일치하는 기능이 없습니다.</p>'}
function cmdOpen(){cmdk.hidden=false;cq.value='';cIdx=0;cmdRender();setTimeout(()=>cq.focus(),0)}
function cmdClose(){cmdk.hidden=true}
function cmdGo(id){cmdClose();location.hash=id}
$('#kbtn').onclick=cmdOpen;cq.oninput=()=>{cIdx=0;cmdRender()};
cl.onclick=e=>{const b=e.target.closest('button');if(b)cmdGo(b.dataset.id)};
cmdk.onclick=e=>{if(e.target===cmdk)cmdClose()};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdk.hidden?cmdOpen():cmdClose();return}
  if(e.key==='Escape'){if(!$('#sheet').hidden){closeEditor();return}if(!$('#onb').hidden)return;}
  if(cmdk.hidden)return;
  if(e.key==='Escape')cmdClose();
  if(e.key==='ArrowDown'){e.preventDefault();cIdx=Math.min(cIdx+1,cRes.length-1);cmdRender()}
  if(e.key==='ArrowUp'){e.preventDefault();cIdx=Math.max(cIdx-1,0);cmdRender()}
  if(e.key==='Enter'&&cRes[cIdx])cmdGo(cRes[cIdx].id)});

    if(startMode==='empty'){ALL_COLS.forEach(n=>{if(ARRS[n])applyCol(n,[]);else if(n==='checklist'||n==='apprMemo'||n==='carriers'||n==='ctd')applyCol(n,{});else if(n==='approvals')applyCol(n,{})});PROFILE.hideColdSamples=true;rebuildCold();ALL_COLS.forEach(n=>{if(n!=='profile')WS.save(n)})}

});
